security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Benevoles
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_oeuvres
            logout:
                path: app_logout
                target: app_oeuvres

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/photos/nouvelle, roles: ROLE_ADMIN }
        - { path: ^/oeuvres/\d+/detruite, roles: ROLE_ADMIN }
        - { path: ^/artistes/\d+/supprimer, roles: ROLE_ADMIN }
        - { path: ^/techniques/\d+/supprimer, roles: ROLE_ADMIN }
        